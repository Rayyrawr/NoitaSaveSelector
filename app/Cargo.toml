[package]
name = "noita_save_selector"
version = "1.1.0"
edition = "2024"
description = "Profile manager for Noita saves (Singleplayer, Noita Together, Entangled Worlds)"
license = "MIT"
repository = "https://github.com/Rayyrawr/NoitaSaveSelector"

[[bin]]
name = "NoitaSaveSelector"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
ureq = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }
winreg = "0.52"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
